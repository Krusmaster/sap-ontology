[project]
name = "sap-ontology"
version = "0.1.0"
description = "SAP Data Dictionary -> graph -> Fabric IQ ontology, in one command"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Gustav Kruse" }]
dependencies = ["pandas>=2.0", "networkx>=3.0", "pyyaml>=6"]
keywords = ["sap", "microsoft-fabric", "ontology", "data-engineering", "fabric-iq"]

[project.optional-dependencies]
deploy = ["requests"]
test = ["pytest"]

[project.scripts]
sap-ontology = "sap_ontology.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sap_ontology*"]
