# Standard S/4HANA CDS view relationships that key-name inference cannot find, because CDS names
# foreign keys by ROLE (SoldToParty) rather than by the target's key (Customer).
# Generic SAP knowledge, no customer content. Entries whose tables are not in your lakehouse are
# ignored. Review, trim, and add your own. action: add = create the edge if absent.
#
# Sales
- {from: I_SALESDOCUMENT,        to: I_CUSTOMER,              field: SOLDTOPARTY,            action: add}
