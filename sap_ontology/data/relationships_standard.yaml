- {from: I_SALESDOCUMENTITEM,    to: I_PRODUCT,               field: MATERIAL,               action: add}
- {from: I_SALESDOCUMENTITEM,    to: I_PLANT,                 field: PRODUCTIONPLANT,        action: add}
- {from: I_SALESDOCUMENTITEM,    to: I_STORAGELOCATION,       field: STORAGELOCATION,        action: add}
- {from: I_SALESDOCUMENTPARTNER, to: I_CUSTOMER,              field: CUSTOMER,               action: add}
- {from: I_BILLINGDOCUMENT,      to: I_CUSTOMER,              field: SOLDTOPARTY,            action: add}
